name: Validate Public Contributions (Single Deterministic Judge)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  judge:
    name: Fail-closed judge (< 2s, zero GPU, zero npm install)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify harness setup
        run: node tools/oedt.mjs setup

      - name: Run single deterministic fail-closed judge
        run: node tools/oedt.mjs check

      - name: Print transparent Global Program Board
        run: node tools/oedt.mjs board

      - name: Run validator and harness unit tests
        run: node --test tests/validate_contribution.test.mjs tests/oedt_harness.test.mjs
